<title>Pip's Math Island</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout concept: graph-paper notebook. A friendly fox (Pip) guides the child across a grid of topic "islands";
   chunky tactile buttons, big type, one signature manipulative per topic. */
:root{
  --bg:#f2f6ff; --grid:#e1e9fa; --card:#ffffff; --ink:#1a2140; --muted:#58628a; --line:#d5def3;
  --accent:#ff7a1a; --accent-ink:#1d1208; --violet:#5b3df5; --gold:#ffbd2e;
  --good:#12935f; --good-bg:#dcf6ea; --bad:#d6333a; --bad-bg:#ffe4e5; --warn-bg:#fff2d1; --warn:#8a5a00;
  --font-d:'Fredoka',ui-rounded,'Trebuchet MS',system-ui,sans-serif;
  --font-b:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10172b; --grid:#172039; --card:#1a2342; --ink:#eef2ff; --muted:#a6b0d4; --line:#2c3862;
  --accent:#ff9440; --violet:#a28dff; --gold:#ffcf5c;
  --good:#3ed598; --good-bg:#12382c; --bad:#ff7a80; --bad-bg:#43191d; --warn-bg:#40320f; --warn:#ffd36b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10172b; --grid:#172039; --card:#1a2342; --ink:#eef2ff; --muted:#a6b0d4; --line:#2c3862;
  --accent:#ff9440; --violet:#a28dff; --gold:#ffcf5c;
  --good:#3ed598; --good-bg:#12382c; --bad:#ff7a80; --bad-bg:#43191d; --warn-bg:#40320f; --warn:#ffd36b; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--bg);color:var(--ink);font:600 17px/1.5 var(--font-b);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--violet);outline-offset:3px;border-radius:12px}
h1,h2,h3{font-family:var(--font-d);margin:0;line-height:1.15;text-wrap:balance}
#app{max-width:980px;margin-inline:auto;padding-block:14px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* buttons */
.btn{font:600 1.15rem var(--font-d);padding:.7rem 1.4rem;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);
  box-shadow:0 5px 0 color-mix(in oklab,var(--accent) 55%,#000);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in oklab,var(--accent) 55%,#000)}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn.alt:active{box-shadow:0 1px 0 var(--line)}
.btn.sm{padding:.4rem .9rem;font-size:1rem;border-radius:12px;box-shadow:0 3px 0 var(--line)}
.btn.big{width:100%;font-size:1.35rem;padding:.9rem}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font:600 1rem var(--font-d)}
.chip svg{width:20px;height:20px}
button.chip[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.chip[aria-pressed="true"]{color:#12112b}}
:root[data-theme="dark"] button.chip[aria-pressed="true"]{color:#12112b}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:10px;font:700 1.45rem var(--font-d)}
.logo svg{width:44px;height:44px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin-bottom:18px}
.hero .pipbox{width:110px}
.bubble{position:relative;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:12px 16px;font-weight:700}
.bubble::before{content:"";position:absolute;left:-12px;top:34px;width:18px;height:18px;background:var(--card);border-left:3px solid var(--line);border-bottom:3px solid var(--line);transform:rotate(45deg)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 14px}
.stat small{display:block;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.72rem}
.stat b{font:700 1.4rem var(--font-d)}
.meter{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:99px;transition:width .6s}
h2.sec{font-size:1.35rem;margin:6px 0 12px}

/* island cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
.island{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:8px;
  box-shadow:0 5px 0 var(--line);transition:transform .1s,box-shadow .1s;min-width:0}
.island:hover{transform:translateY(-2px)}
.island:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.tile{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;color:var(--c);
  background:color-mix(in oklab,var(--c) 20%,var(--card));border:2px solid color-mix(in oklab,var(--c) 50%,var(--card))}
.tile svg{width:34px;height:34px}
.island h3{font-size:1.08rem}
.stars{display:flex;gap:2px;color:var(--gold)}
.stars svg{width:20px;height:20px}
.stars .off{color:var(--line)}
.tier{font-size:.8rem;color:var(--muted);font-weight:800}
.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:16px;background:linear-gradient(100deg,color-mix(in oklab,var(--violet) 18%,var(--card)),var(--card))}
.wide h3{font-size:1.3rem}
.foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}

/* quiz */
.quiz{max-width:680px;margin-inline:auto}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line);border:2px solid var(--line)}
.dot.cur{background:var(--card);border-color:var(--violet);transform:scale(1.25)}
.dot.g{background:var(--good);border-color:var(--good)} .dot.y{background:var(--gold);border-color:var(--gold)} .dot.b{background:var(--bad);border-color:var(--bad)}
.stage{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;margin-bottom:10px}
.stage .bubble{padding:8px 14px;font-size:.98rem}
.stage .bubble::before{top:26px}
.qcard{background:var(--card);border:3px solid var(--line);border-radius:26px;padding:20px 18px;box-shadow:0 6px 0 var(--line)}
.prompt{font-size:clamp(1.35rem,4.6vw,1.9rem);text-align:center;margin-bottom:12px;overflow-wrap:anywhere}
.vis{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 16px;min-height:20px}
.vis svg{max-width:100%;height:auto}
.eq{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.op{font:700 2rem var(--font-d)}
.dot-v{fill:var(--violet)}
.xx{stroke:var(--bad);stroke-width:3;stroke-linecap:round}
.opts{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.opts.n2{grid-template-columns:1fr 1fr}
.opt{position:relative;font:600 clamp(1.3rem,5vw,1.8rem) var(--font-d);padding:16px 10px;border-radius:20px;background:var(--card);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);min-height:68px;
  display:flex;align-items:center;justify-content:center;transition:transform .08s}
.opt kbd{position:absolute;left:10px;top:8px;font:700 .72rem var(--font-b);color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--violet)}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.opt.no{background:var(--bad-bg);border-color:var(--bad);opacity:.75}
.opt.ok{background:var(--good-bg);border-color:var(--good)}
.disp{font:700 2.4rem var(--font-d);text-align:center;border:3px dashed var(--line);border-radius:18px;padding:6px;min-height:68px;display:grid;place-items:center;margin-bottom:12px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.disp .ph{color:var(--line)}
.disp.no{border-color:var(--bad);background:var(--bad-bg)} .disp.ok{border-color:var(--good);background:var(--good-bg)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;max-width:340px;margin-inline:auto}
.key{font:600 1.5rem var(--font-d);padding:10px 0;border-radius:16px;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.key:disabled{opacity:.25}
.tools{display:flex;justify-content:center;margin-top:12px}
#fb{margin-top:14px;min-height:8px}
.fb{border-radius:20px;padding:14px 16px;display:grid;gap:10px;border:3px solid}
.fb.good{background:var(--good-bg);border-color:var(--good)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb.tip{background:var(--warn-bg);border-color:var(--gold)}
.fb strong{font:700 1.2rem var(--font-d)}
.fb p{margin:0}

/* math bits */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .15em;font-family:var(--font-d)}
.fr i{font-style:normal;padding:0 .2em}
.fr i:first-child{border-bottom:.09em solid currentColor}
.box{display:inline-grid;place-items:center;min-width:1.5em;height:1.5em;border:3px dashed var(--accent);border-radius:10px;color:var(--accent);padding:0 .2em}
.seq{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.seq b{display:inline-grid;place-items:center;min-width:58px;height:58px;padding:0 10px;border-radius:16px;background:color-mix(in oklab,var(--violet) 14%,var(--card));border:3px solid var(--line);font:600 1.5rem var(--font-d)}
.seq b.q{border:3px dashed var(--accent);color:var(--accent);background:var(--card)}
.tag{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:color-mix(in oklab,var(--gold) 28%,var(--card));border:2px solid var(--gold);border-radius:12px 18px 18px 12px;font:600 1.3rem var(--font-d)}
.shape{fill:color-mix(in oklab,var(--violet) 28%,var(--card));stroke:var(--violet);stroke-width:4;stroke-linejoin:round}
.lbl{font:700 15px var(--font-b);fill:var(--ink)}
.clk-f{fill:var(--card);stroke:var(--ink);stroke-width:4}
.clk-n{font:600 13px var(--font-d);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.hand{stroke:var(--ink);stroke-linecap:round}
.hand.m{stroke:var(--accent)}
.coin{stroke-width:3}
.coin-t{font:700 16px var(--font-d);text-anchor:middle;dominant-baseline:central;fill:#3b2a00}
.bill{fill:#bfe8c9;stroke:#2e8b57;stroke-width:3}
.bill-t{font:700 18px var(--font-d);text-anchor:middle;dominant-baseline:central;fill:#124d2c}
.plate{fill:none;stroke:var(--muted);stroke-width:3;stroke-dasharray:6 5}

/* result, stickers, parents */
.center{text-align:center}
.bigstars{display:flex;justify-content:center;gap:6px;color:var(--gold);margin:6px 0 12px}
.bigstars svg{width:64px;height:64px}
.bigstars .off{color:var(--line)}
.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px 18px}
.list{display:grid;gap:10px;margin:12px 0;text-align:left}
.list .it{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.list .it .eqs{font:600 1.15rem var(--font-d)}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.stk .s{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px;text-align:center;display:grid;gap:4px;justify-items:center}
.stk .s svg{width:72px;height:72px}
.stk .s small{color:var(--muted);font-weight:700;line-height:1.3}
.stk .s.lock{opacity:.6}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:left;border-bottom:2px solid var(--line)}
th{font:600 .95rem var(--font-d);color:var(--muted)}
.tw{overflow-x:auto}
.timer{height:16px;border-radius:99px;background:var(--line);overflow:hidden;flex:1}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--good),var(--gold),var(--accent));transform-origin:left}
.rq{font:700 clamp(2.4rem,11vw,4rem) var(--font-d);text-align:center;margin:8px 0 18px;font-variant-numeric:tabular-nums}
.wel{max-width:560px;margin:20px auto;text-align:center;display:grid;gap:16px;justify-items:center}
.wel input{font:600 1.4rem var(--font-d);padding:12px 16px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);width:100%;max-width:340px;text-align:center}
.wel label{font:700 1rem var(--font-d);color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;display:grid;gap:8px;justify-items:center;width:max-content;max-width:92vw}
#toast div{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:16px;font:600 1.05rem var(--font-d);animation:pop .4s both}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}
.bounce{animation:bounce .7s ease 2}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .3s}
@media (max-width:520px){.hero{grid-template-columns:78px 1fr}.hero .pipbox{width:78px}.wide{flex-direction:column;align-items:flex-start}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(function(){
'use strict';
/* ============================================================ state ============ */
const KEY='pip-math-island-v1';
const defaults=()=>({name:'',grade:1,lang:((typeof navigator!=='undefined'&&navigator.language)||'en').toLowerCase().indexOf('es')===0?'es':'en',
  sound:true,xp:0,streak:0,last:'',rounds:0,day:{d:'',rounds:0,bonus:false},badges:{},race:0,p:{},started:false});
const S=defaults();
function load(){try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j&&j.v===1)Object.assign(S,j.s);}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({v:1,s:S}));}catch(e){}}
const L=(en,es)=>S.lang==='es'?es:en;
const loc=()=>S.lang==='es'?'es-ES':'en-US';
const prog=(id,g)=>{g=g||S.grade;S.p[g]=S.p[g]||{};return S.p[g][id]=S.p[g][id]||{t:0,s:0,n:0,ok:0};};

/* ============================================================ helpers ============ */
const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[r(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=r(0,i);const t=a[i];a[i]=a[j];a[j]=t;}return a;};
const rnd=(x,d)=>{const k=Math.pow(10,d);return Math.round(x*k)/k;};
const fmt=n=>Number(n).toLocaleString(loc(),{maximumFractionDigits:2});
const fmtF=(n,d)=>Number(n).toLocaleString(loc(),{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F=(n,d)=>`<span class="fr"><i>${n}</i><i>${d}</i></span>`;
const BOX='<span class="box">?</span>';
const gcd=(a,b)=>b?gcd(b,a%b):a;

function numOpts(ans,dec){
  const s=new Set([ans]);
  const steps=dec?[.1,-.1,.01,-.01,1,-1,10,-10,.5,-.5]:[1,-1,2,-2,10,-10,5,-5,100,-100,3,-3];

  const cards=TOPICS.map(t=>{const p=prog(t.id);return `<button class="island" data-a="play" data-id="${t.id}" style="--c:${t.c}"><span class="tile">${icon(t.id)}</span><h3>${L(t.n[0],t.n[1])}</h3>${starsRow(p.s,3)}<span class="tier">${L('Level','Nivel')} ${p.t+1}/3</span></button>`;}).join('');
  return `${topBar(false)}
  <div class="hero"><div class="pipbox bounce">${pip('happy',110)}</div><div class="bubble"><b>${L('Hi','Hola')}, ${name}!</b> ${pick(MSG[S.lang])}</div></div>
  <div class="chips" style="margin-bottom:14px"><span class="chip">${L('Grade','Grado')}</span>${[1,2,3,4,5,6].map(g=>`<button class="chip" data-a="grade" data-g="${g}" aria-pressed="${S.grade===g}" aria-label="${L('Grade','Grado')} ${g}">${g}</button>`).join('')}</div>
  <div class="stats">
    <div class="stat"><small>${L('Level','Nivel')} ${li.level}</small><b>${fmt(S.xp)} XP</b><div class="meter" role="img" aria-label="${Math.round(li.pct)}%"><i style="width:${li.pct}%"></i></div></div>
    <div class="stat"><small>${L('Stars','Estrellas')}</small><b>${totalStars()} ★</b></div>
    <div class="stat"><small>${L('Day streak','Racha de días')}</small><b>${liveStreak()} <svg width="22" height="22" style="color:var(--accent);vertical-align:-3px"><use href="#i-flame"/></svg></b></div>
    <div class="stat"><small>${L('Today: 3 rounds = +30 XP','Hoy: 3 rondas = +30 XP')}</small><b>${Math.min(tr,3)}/3</b><div class="meter"><i style="width:${Math.min(tr,3)/3*100}%"></i></div></div></div>
  <h2 class="sec">${L('Choose an island','Elige una isla')}</h2>
  <div class="grid">${cards}
    <button class="island wide" data-a="race" style="--c:#5b3df5"><span class="tile">${icon('count').replace('<circle','<path d="M13 3L5 17h7l-2 12 11-16h-7z" fill="currentColor"/><circle')}</span><span><h3>${L('Quick Race','Carrera rápida')}</h3><span class="tier">${L('60 seconds. How many can you solve?','60 segundos. ¿Cuántas puedes resolver?')} ${L('Best','Récord')}: ${S.race}</span></span></button></div>
  <div class="foot"><button class="btn alt" data-a="stickers">${L('My stickers','Mis stickers')} (${Object.keys(S.badges).length}/${BADGES.length})</button><button class="btn alt" data-a="parent">${L('Grown-ups corner','Rincón de adultos')}</button></div>`;}

/* ---- quiz ---- */
function startRound(id){const t=TOPICS.find(x=>x.id===id),pr=prog(id),qs=[],seen={};
  for(let i=0;i<10;i++){let q,tries=0;do{q=t.gen(S.grade,i<3?Math.max(0,pr.t-1):pr.t);tries++;}while(seen[q.prompt+q.vis]&&tries<8);seen[q.prompt+q.vis]=1;q.topic=id;qs.push(q);}
  Q={id,t,qs,i:0,tries:0,first:0,second:0,res:[],missed:[],streak:0,best:0,locked:false,input:'',xp:0,lvl0:levelInfo(S.xp).level};hintShown=false;go('quiz');}
const KEYS=['1','2','3','4','5','6','7','8','9','.','0','del'];
function vQuiz(){const q=Q.qs[Q.i];
  const dots=Q.qs.map((_,i)=>{const x=Q.res[i];return `<i class="dot ${i===Q.i?'cur':x===2?'g':x===1?'y':x===0?'b':''}"></i>`;}).join('');
  const ans=q.kind==='choice'?`<div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-a="pick" data-i="${i}"><kbd>${i+1}</kbd>${o}</button>`).join('')}</div>`:
    `<div class="disp" id="disp" aria-live="polite">${Q.input?esc(Q.input):'<span class="ph">?</span>'}</div><div class="keys">${KEYS.map(k=>`<button class="key" data-a="k" data-v="${k}" ${k==='.'&&!q.dec?'disabled':''} aria-label="${k==='del'?L('Delete','Borrar'):k}">${k==='del'?'⌫':k==='.'?(S.lang==='es'?',':'.'):k}</button>`).join('')}</div><button class="btn big" data-a="check">${L('Check','Comprobar')}</button>`;
  return `<div class="quiz"><div class="qtop"><button class="btn alt sm" data-a="home" aria-label="${L('Back','Volver')}">←</button><div class="dots" role="img" aria-label="${Q.i+1}/10">${dots}</div><span class="chip">${icon(Q.id).replace('<svg','<svg style="color:'+Q.t.c+'"')}${Q.i+1}/10</span></div>
  <div class="stage"><div id="pipbox">${pip('happy',84)}</div><div class="bubble" id="bub">${pick(S.lang==='es'?['¡Tú puedes!','Piénsalo con calma.','¡Vamos, campeona!']:["You've got this!","Take your time.","Let's go, champ!"])}</div></div>
  <section class="qcard"><h2 class="prompt">${q.prompt}</h2>${q.vis?`<div class="vis">${q.vis}</div>`:''}<div id="ans">${ans}</div>
  <div class="tools"><button class="btn alt sm" data-a="hint" id="hintBtn">${L('Hint','Pista')}</button></div></section><div id="fb" aria-live="polite"></div></div>`;}
function setPip(mood,msg){$('pipbox').innerHTML=pip(mood,84);if(msg)$('bub').textContent=msg;}
function showFb(kind,html,next){$('fb').innerHTML=`<div class="fb ${kind}">${html}${next?`<button class="btn" data-a="next" id="nextBtn" data-focus>${Q.i===9?L('Finish','Terminar'):L('Next','Siguiente')}</button>`:''}</div>`;
  const nb=$('nextBtn');if(nb&&nb.focus)nb.focus({preventScroll:false});}
function submit(val){if(!Q||Q.locked)return;const q=Q.qs[Q.i];if(q.kind==='num'&&String(val).trim()==='')return;
  Q.tries++;const ok=check(q,val);
  if(ok){Q.locked=true;const first=Q.tries===1;
    if(first){Q.first++;Q.streak++;Q.best=Math.max(Q.best,Q.streak);Q.res[Q.i]=2;}else{Q.second++;Q.streak=0;Q.res[Q.i]=1;}
    const gain=first?10+Math.min(Q.streak,5):5;S.xp+=gain;Q.xp+=gain;
    sfx('ok');setPip('cheer',first?pick(L2(['Awesome!','Perfect!','Brilliant!','You rock!'],['¡Genial!','¡Perfecto!','¡Brillante!','¡Eres una crack!'])):L('You got it!','¡Lo lograste!'));
    markAnswer(q,val,true);
    showFb('good',`<strong>${first?L('Correct!','¡Correcto!'):L('You figured it out!','¡Lo descubriste!')} +${gain} XP</strong>`+(first?'':`<p>${q.why}</p>`),true);
  }else{Q.streak=0;sfx('no');
    if(Q.tries===1){setPip('think',L('Not yet. Look at the hint and try again!','Todavía no. ¡Mira la pista e inténtalo otra vez!'));markAnswer(q,val,false);hintShown=true;
      showFb('tip',`<strong>${L('Almost! Try once more.','¡Casi! Inténtalo otra vez.')}</strong><p>${q.hint}</p>`,false);}
    else{Q.locked=true;Q.res[Q.i]=0;Q.missed.push(q);setPip('sad',L("That one was tricky. Let's learn it!","Esa estuvo difícil. ¡Vamos a aprenderla!"));markAnswer(q,val,false);revealAnswer(q);
      showFb('bad',`<strong>${L('The answer is','La respuesta es')} ${q.kind==='choice'?q.answer:fmt(q.answer)}</strong><p>${q.why}</p>`,true);}}}
function L2(en,es){return S.lang==='es'?es:en;}
function markAnswer(q,val,ok){
  if(q.kind==='choice'){const bs=app().querySelectorAll('.opt');bs.forEach((b,i)=>{if(q.opts[i]===val){b.classList.add(ok?'ok':'no');b.disabled=true;}});}
  else{const d=$('disp');if(d){d.classList.add(ok?'ok':'no');if(!ok){d.classList.add('shake');Q.input='';setTimeout(()=>{const dd=$('disp');if(dd){dd.classList.remove('no','shake');dd.innerHTML='<span class="ph">?</span>';}},650);}}}
  if(Q.locked){app().querySelectorAll('.opt,.key,[data-a="check"],#hintBtn').forEach(b=>b.disabled=true);}}
function revealAnswer(q){if(q.kind==='choice'){app().querySelectorAll('.opt').forEach((b,i)=>{if(q.opts[i]===q.answer)b.classList.add('ok');});}else{const d=$('disp');if(d){d.classList.remove('no','shake');d.classList.add('ok');d.textContent=fmt(q.answer);}}}
function nextQ(){if(!Q||!Q.locked)return;if(Q.i>=9){finishRound();return;}Q.i++;Q.tries=0;Q.locked=false;Q.input='';hintShown=false;app().innerHTML=vQuiz();}
function finishRound(){const first=Q.first,sec=Q.second,score=first+sec*.5,stars=score>=9?3:score>=7?2:score>=5?1:0,pr=prog(Q.id),t0=pr.t;
  pr.n+=10;pr.ok+=first+sec;pr.s=Math.max(pr.s,stars);if(first>=9&&pr.t<2)pr.t++;else if(first<=4&&pr.t>0)pr.t--;
  const bonus=bumpDay(),nb=award({perfect:first===10,combo:Q.best});
  Q.result={stars,t0,t1:pr.t,bonus,nb,lvlUp:levelInfo(S.xp).level>Q.lvl0};save();sfx(stars>0?'win':'no');if(stars>=2)setTimeout(confetti,200);go('result');}
function vResult(){const x=Q.result,li=levelInfo(S.xp);
  const msg=x.stars===3?L('Amazing work!','¡Trabajo increíble!'):x.stars===2?L('Great job!','¡Muy bien!'):x.stars===1?L('Nice try! Practice makes progress.','¡Buen intento! Practicando se avanza.'):L("Let's try again. You'll get better each time!","¡Intentemos otra vez! ¡Mejorarás cada vez!");
  const tier=x.t1>x.t0?`<div class="chip" style="color:var(--good)">${L('Level up! This island is now level','¡Subiste! Esta isla ahora es nivel')} ${x.t1+1}</div>`:x.t1<x.t0?`<div class="chip">${L('Next round will be a little easier.','La próxima ronda será un poco más fácil.')}</div>`:'';
  const review=Q.missed.length?`<h2 class="sec" style="margin-top:20px">${L("Let's review","Repasemos")}</h2><div class="list">${Q.missed.map(q=>`<div class="it"><span class="eqs">${q.prompt}</span><span>→ <b>${q.kind==='choice'?q.answer:fmt(q.answer)}</b></span><small style="flex-basis:100%;color:var(--muted)">${q.why}</small></div>`).join('')}</div>`:'';
  return `<div class="quiz center">${pip(x.stars>1?'cheer':x.stars?'happy':'think',130)}<h1>${msg}</h1>
  <div class="bigstars" role="img" aria-label="${x.stars}/3">${[0,1,2].map(i=>`<svg class="${i<x.stars?'pop':'off'}" style="animation-delay:${i*.25}s"><use href="#i-star"/></svg>`).join('')}</div>
  <p><b>${Q.first}</b> ${L('right on the first try','bien a la primera')} · <b>${Q.second}</b> ${L('on the second','a la segunda')} · +${Q.xp+(x.bonus?30:0)} XP</p>
  <div class="row" style="justify-content:center">${tier}${x.lvlUp?`<div class="chip" style="color:var(--violet)">${L('Player level','Nivel de jugador')} ${li.level}!</div>`:''}${x.bonus?`<div class="chip" style="color:var(--good)">${L('Daily goal done! +30 XP','¡Meta diaria cumplida! +30 XP')}</div>`:''}</div>
  ${x.nb.length?`<h2 class="sec" style="margin-top:18px">${L('New stickers!','¡Stickers nuevos!')}</h2><div class="row" style="justify-content:center">${x.nb.map(b=>`<div class="pop" style="width:96px">${stickerSVG(b,true)}<small>${L(b.n[0],b.n[1])}</small></div>`).join('')}</div>`:''}
  ${review}<div class="row" style="justify-content:center;margin-top:20px"><button class="btn" data-a="play" data-id="${Q.id}" data-focus>${L('Play again','Jugar otra vez')}</button><button class="btn alt" data-a="home">${L('Home','Inicio')}</button></div></div>`;}

/* ---- quick race ---- */
function startRace(){R={score:0,combo:0,best:0,end:Date.now()+60000,q:raceQ(S.grade),lock:false,iv:null};go('race');
  R.iv=setInterval(()=>{const left=Math.max(0,R.end-Date.now()),bar=document.querySelector('.timer i'),tl=$('tleft');if(bar)bar.style.transform=`scaleX(${left/60000})`;if(tl)tl.textContent=Math.ceil(left/1000);if(left<=0)endRace();},150);}
function stopRace(){if(R&&R.iv){clearInterval(R.iv);R.iv=null;}}
function raceBody(){const q=R.q;return `<div class="rq">${q.prompt} = ?</div><div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-a="rpick" data-i="${i}"><kbd>${i+1}</kbd>${o}</button>`).join('')}</div>`;}
function vRace(){return `<div class="quiz"><div class="qtop"><button class="btn alt sm" data-a="home" aria-label="${L('Back','Volver')}">←</button><div class="timer"><i></i></div><span class="chip"><span id="tleft">60</span>s</span></div>
  <div class="row" style="justify-content:center;margin-bottom:6px"><span class="chip">${L('Score','Puntos')}: <b id="rs">0</b></span><span class="chip">${L('Combo','Combo')}: <b id="rc">0</b></span></div>
  <section class="qcard" id="rbox">${raceBody()}</section></div>`;}
function racePick(i){if(!R||R.lock)return;const q=R.q,ok=q.opts[i]===q.answer,btns=app().querySelectorAll('.opt');
  if(ok){R.score++;R.combo++;R.best=Math.max(R.best,R.combo);sfx('tick');R.q=raceQ(S.grade);$('rs').textContent=R.score;$('rc').textContent=R.combo;$('rbox').innerHTML=raceBody();}
  else{R.combo=0;sfx('no');R.lock=true;btns[i].classList.add('no');btns.forEach((b,j)=>{if(q.opts[j]===q.answer)b.classList.add('ok');});$('rc').textContent=0;
    setTimeout(()=>{if(!R)return;R.lock=false;R.q=raceQ(S.grade);const bx=$('rbox');if(bx&&screen==='race')bx.innerHTML=raceBody();},550);}}
function endRace(){stopRace();const rec=R.score>S.race;S.race=Math.max(S.race,R.score);S.xp+=R.score*2;const nb=award({combo:0});R.rec=rec;R.nb=nb;save();sfx('win');if(rec||R.score>=10)setTimeout(confetti,200);go('rresult');}
function vRaceResult(){return `<div class="quiz center">${pip(R.score>=10?'cheer':'happy',130)}<h1>${R.rec&&R.score>0?L('New record!','¡Nuevo récord!'):L("Time's up!",'¡Se acabó el tiempo!')}</h1>
  <p style="font:700 3.4rem var(--font-d);margin:6px 0">${R.score}</p><p>${L('answers right','respuestas correctas')} · ${L('Best combo','Mejor combo')}: ${R.best} · ${L('Record','Récord')}: ${S.race} · +${R.score*2} XP</p>
  ${R.nb.length?`<div class="row" style="justify-content:center">${R.nb.map(b=>`<div class="pop" style="width:96px">${stickerSVG(b,true)}<small>${L(b.n[0],b.n[1])}</small></div>`).join('')}</div>`:''}
  <div class="row" style="justify-content:center;margin-top:20px"><button class="btn" data-a="race" data-focus>${L('Race again','Correr otra vez')}</button><button class="btn alt" data-a="home">${L('Home','Inicio')}</button></div></div>`;}

/* ---- stickers & grown-ups ---- */
function vStickers(){return `${topBar(true)}<h2 class="sec">${L('My stickers','Mis stickers')} (${Object.keys(S.badges).length}/${BADGES.length})</h2><div class="stk">${BADGES.map(b=>{const on=!!S.badges[b.id];
  return `<div class="s ${on?'':'lock'}">${stickerSVG(b,on)}<b>${L(b.n[0],b.n[1])}</b><small>${L(b.d[0],b.d[1])}</small></div>`;}).join('')}</div>`;}
let confirmReset=false;
function vParent(){const rows=TOPICS.map(t=>{const p=prog(t.id),acc=p.n?Math.round(100*p.ok/p.n):null;return `<tr><td>${L(t.n[0],t.n[1])}</td><td>${p.n}</td><td>${acc===null?'—':acc+'%'}</td><td>${starsRow(p.s,3)}</td><td>${p.t+1}/3</td></tr>`;}).join('');
  return `${topBar(true)}<h2 class="sec">${L('Grown-ups corner','Rincón de adultos')}</h2>
  <div class="card"><p style="margin-top:0">${L(`Progress for ${esc(S.name)}, grade ${S.grade}. Questions adapt: after a round with 9 or more first-try answers the topic moves up a level; with 4 or fewer it eases down. Wrong answers always get a hint first, then an explanation.`,
    `Progreso de ${esc(S.name)}, grado ${S.grade}. Las preguntas se adaptan: con 9 o más aciertos a la primera el tema sube de nivel; con 4 o menos baja. Cada error recibe primero una pista y luego una explicación.`)}</p>
  <div class="tw"><table><thead><tr><th>${L('Topic','Tema')}</th><th>${L('Questions','Preguntas')}</th><th>${L('Accuracy','Aciertos')}</th><th>${L('Stars','Estrellas')}</th><th>${L('Difficulty','Dificultad')}</th></tr></thead><tbody>${rows}</tbody></table></div></div>
  <div class="row" style="margin-top:16px"><button class="btn alt" data-a="profile">${L('Change name, grade or language','Cambiar nombre, grado o idioma')}</button>
  <button class="btn alt" data-a="reset">${confirmReset?L('Tap again to erase everything','Toca otra vez para borrar todo'):L('Reset all progress','Borrar todo el progreso')}</button></div>
  <p style="color:var(--muted)">${L('Progress is saved only in this browser. Nothing is sent anywhere.','El progreso se guarda solo en este navegador. No se envía nada a ningún sitio.')}</p>`;}

/* ============================================================ events ============ */
const ACT={
  begin(){const n=$('nm');S.name=(n&&n.value.trim())||L('Friend','Amigo');S.started=true;go('home');},
  grade(d){const n=$('nm');if(n)S.name=n.value;S.grade=+d.g;save();go(screen);},
  setlang(d){const n=$('nm');if(n)S.name=n.value;S.lang=d.l;go('welcome');},
  lang(){S.lang=S.lang==='es'?'en':'es';go(screen);},
  sound(){S.sound=!S.sound;if(S.sound)sfx('ok');go(screen);},
  home(){confirmReset=false;go('home');},
  play(d){startRound(d.id);},
  pick(d){const q=Q&&Q.qs[Q.i];if(q)submit(q.opts[+d.i]);},
  k(d){if(!Q||Q.locked)return;const q=Q.qs[Q.i];if(q.kind!=='num')return;
    if(d.v==='del')Q.input=Q.input.slice(0,-1);else if(d.v==='.'){if(q.dec&&Q.input.indexOf('.')<0)Q.input+=Q.input?'.':'0.';}else if(Q.input.length<9)Q.input+=d.v;
    const e=$('disp');if(e){e.classList.remove('no','shake');e.textContent=Q.input?Q.input.replace('.',S.lang==='es'?',':'.'):'';if(!Q.input)e.innerHTML='<span class="ph">?</span>';}},
  check(){if(Q)submit(Q.input);},
  next(){nextQ();},
  hint(){if(!Q||Q.locked)return;const q=Q.qs[Q.i];setPip('think',L('Here is a little help.','Aquí tienes una ayuda.'));showFb('tip',`<strong>${L('Hint','Pista')}</strong><p>${q.hint}</p>`,false);},
  race(){startRace();},
  rpick(d){racePick(+d.i);},
  stickers(){go('stickers');},
  parent(){confirmReset=false;go('parent');},
  profile(){go('welcome');},
  reset(){if(!confirmReset){confirmReset=true;go('parent');return;}confirmReset=false;const lang=S.lang;Object.assign(S,defaults(),{lang});S.started=false;save();go('welcome');}
};
function onKey(e){if(e.ctrlKey||e.metaKey||e.altKey)return;const tg=e.target;if(tg&&tg.tagName==='INPUT')return;
  if(screen==='quiz'&&Q){const q=Q.qs[Q.i];
    if(e.key==='Enter'){e.preventDefault();if(Q.locked)nextQ();else if(q.kind==='num')submit(Q.input);return;}
    if(Q.locked)return;
    if(q.kind==='num'){if(/^[0-9]$/.test(e.key))ACT.k({v:e.key});else if(e.key==='.'||e.key===',')ACT.k({v:'.'});else if(e.key==='Backspace'){e.preventDefault();ACT.k({v:'del'});}}
    else if(/^[1-4]$/.test(e.key)&&q.opts[+e.key-1]!==undefined)submit(q.opts[+e.key-1]);}
  else if(screen==='race'&&R&&/^[1-4]$/.test(e.key))racePick(+e.key-1);}
function init(){load();
  document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-a]');if(!b||b.disabled)return;const f=ACT[b.dataset.a];if(f)f(b.dataset,b);});
  document.addEventListener('keydown',onKey);
  if(S.started)go('home');else go('welcome');}

if(window.__PIP_TEST){window.__pip={S,TOPICS,raceQ,check,levelInfo,BADGES,award};return;}
init();
})();
</script>
